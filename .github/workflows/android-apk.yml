name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'scripts/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate bundled web application
        run: node scripts/validate-web.mjs
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: gradle -p android assembleDebug
      - name: Verify APK before publication
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: african-safari-pocketbook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish complete APK without binary transport
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          test -n "$VERSION_NAME"
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk "releases/AfricanSafariPocketbook-v${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/AfricanSafariPocketbook-latest.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/AfricanSafariPocketbook-v${VERSION_NAME}.apk" releases/AfricanSafariPocketbook-latest.apk
          if git diff --cached --quiet; then
            echo "Published APK already matches this build."
          else
            git commit -m "Publish verified African Safari Pocketbook v${VERSION_NAME} APK"
            git push
          fi
