name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'scripts/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve testing signature between releases
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: african-safari-pocketbook-debug-signing-v1
      - name: Validate bundled web application
        run: node scripts/validate-web.mjs
      - name: Validate Safari Circle service
        run: |
          npm ci --prefix server --ignore-scripts
          npm --prefix server run check
          npm --prefix server test
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: gradle -p android assembleDebug
      - name: Run Android interaction journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            TEST_STATUS=0
            gradle -p android connectedDebugAndroidTest || TEST_STATUS=$?
            mkdir -p test-artifacts/android
            adb logcat -d | tee test-artifacts/android/logcat.txt
            adb pull /sdcard/Android/data/africa.safaricompass.app/files/screenshots test-artifacts/android/ || true
            cp -R android/app/build/reports/androidTests test-artifacts/android/reports || true
            exit $TEST_STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-interaction-screenshots
          path: test-artifacts/android
          if-no-files-found: warn
      - name: Verify APK before publication
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: african-safari-pocketbook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish complete APK without binary transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          test -n "$VERSION_NAME"
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk "releases/AfricanSafariPocketbook-v${VERSION_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/AfricanSafariPocketbook-latest.apk
          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            gh release upload "v${VERSION_NAME}" "releases/AfricanSafariPocketbook-v${VERSION_NAME}.apk" --clobber
          else
            gh release create "v${VERSION_NAME}" "releases/AfricanSafariPocketbook-v${VERSION_NAME}.apk" --title "African Safari Pocketbook v${VERSION_NAME}" --notes "Verified Android test build. Download the APK asset below." --latest
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/AfricanSafariPocketbook-v${VERSION_NAME}.apk" releases/AfricanSafariPocketbook-latest.apk
          if git diff --cached --quiet; then
            echo "Published APK already matches this build."
          else
            git commit -m "Publish verified African Safari Pocketbook v${VERSION_NAME} APK"
            git push
          fi
