plugins { id 'com.android.application' }

android {
    namespace 'africa.safaricompass.app'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'africa.safaricompass.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.10.0'
    }

    sourceSets { main.assets.srcDirs = ['../../dist'] }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
